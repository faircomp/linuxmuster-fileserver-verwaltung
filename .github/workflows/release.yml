# SPDX-License-Identifier: GPL-3.0-or-later
#
# From linuxmusterDEV/templates/release.yml, modeled on
# lmndev-runner/workflows/*.release.yml: version and distribution come from the
# first line of debian/changelog; the tag must match it. No publish job yet
# (no faircomp/deb archive); add the upstream publish job when it exists.
#
# Supply chain (hub templates/release.yml, stage A): build image by digest and every
# action by commit SHA (same pins as ci.yml), no third-party release action next to
# `contents: write`. The release is created as a DRAFT, all assets are uploaded and
# compared by sha256 with the build, and only then published: GitHub immutable releases
# freeze tag and assets on publish, so a release published first could not receive its
# assets afterwards. A failed run leaves a draft that a re-run completes.
# Immutable or not at all: right before publishing, while the release is still a draft, the
# job checks that immutable releases are on for this repo, and after publishing it re-reads the
# release and fails unless `immutable` is true. The setting only acts on releases published after
# it was switched on (7.3.4 and older came out mutable while the run stayed green). GITHUB_TOKEN
# cannot read the setting: the endpoint needs the Administration permission, which no
# GITHUB_TOKEN can hold (HTTP 403 even with `permissions: write-all`). The repo secret
# IMMUTABLE_CHECK_TOKEN therefore holds a fine-grained token for this repo with only
# "Administration: Read-only"; without it the release stays a draft.
name: release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      prev_tag:
        description: 'upgrade smoke: tag to upgrade from (empty = newest published release)'
        required: false
        default: ''

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: meta
        run: |
          VERSION=$(dpkg-parsechangelog -S Version)
          DIST=$(dpkg-parsechangelog -S Distribution); NUM="${DIST#lmn}"
          TAGVER="${GITHUB_REF_NAME#v}"; TAGVER="${TAGVER//-rc/~rc}"   # v7.3.1-rc1 -> 7.3.1~rc1
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$TAGVER" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match debian/changelog version $VERSION"; exit 1; fi
          # Pinned by digest (see the header); Renovate bumps both lines here and in ci.yml.
          IMG_LMN73=ghcr.io/linuxmuster/lmndev-runner:24.04@sha256:6b0c8ac994cf1d2da44b0b36ebd7b3b125094886e78293e04b9db5e515b8209e
          IMG_LMN74=ghcr.io/linuxmuster/lmndev-runner:latest@sha256:d735e6ccc6fd9df71b2552b06ac6f5cb4bf2d03f40e14bafe47213325b7b801b
          if [ "${NUM:-0}" -ge 74 ] 2>/dev/null; then IMG=$IMG_LMN74; else IMG=$IMG_LMN73; fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"; echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.gate.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          apt-get update -qq && apt-get build-dep -y -qq . 2>/dev/null || true
          make deb
          # The .changes lists the source package too; the release publishes every file it names.
          mkdir -p output && mv ../*.deb ../*.changes ../*.buildinfo ../*.dsc ../*.tar.* output/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: output/
          if-no-files-found: error

  install-smoke:
    needs: build
    # Same steps as in ci.yml: releasing a package that cannot be installed
    # is worse than not releasing at all.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: packages/
      - name: Install the package
        # All dependencies come from Ubuntu 24.04 itself, no extra apt source.
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./packages/linuxmuster-fileserver-verwaltung_*.deb
      - name: The CLI must be on PATH and runnable
        run: |
          test "$(command -v linuxmuster-fileserver-verwaltung)" = /usr/bin/linuxmuster-fileserver-verwaltung
          linuxmuster-fileserver-verwaltung --help
          linuxmuster-fileserver-verwaltung setup --help
      - name: Pure functions must actually run
        # "--help" exits through argparse and touches almost no code, so it
        # happily passes even when a constant went missing in a refactor and
        # every real invocation dies with a NameError. Import the module and
        # call the functions that need no root and no domain.
        run: |
          python3 - <<'PY'
          import importlib.util
          from importlib.machinery import SourceFileLoader

          loader = SourceFileLoader("lmv", "/usr/bin/linuxmuster-fileserver-verwaltung")
          spec = importlib.util.spec_from_loader("lmv", loader)
          module = importlib.util.module_from_spec(spec)
          loader.exec_module(module)

          module.validate_share_name("Verwaltung")
          for name in ("Ver/waltung", "a:b", ""):
              try:
                  module.validate_share_name(name)
              except module.SetupError:
                  continue
              raise SystemExit("invalid share name accepted: %r" % name)

          module.check_time_sync()
          print("pure functions OK")
          PY
      - name: The templates must be installed
        run: |
          for template in smb.conf krb5.conf nsswitch.conf; do
            test -f "/var/lib/linuxmuster-fileserver-verwaltung/$template.example" \
              || { echo "missing: $template.example"; exit 1; }
          done
      - name: The rendered smb.conf must be valid Samba configuration
        run: |
          sed -e 's/%%DOMAIN%%/LINUXMUSTER.LAN/g' \
              -e 's/%%WORKGROUP%%/LINUXMUSTER/g' \
              -e 's/%%HOSTNAME%%/VERWALTUNG01/g' \
              /var/lib/linuxmuster-fileserver-verwaltung/smb.conf.example \
              | sudo tee /etc/samba/smb.conf > /dev/null
          sudo testparm -s

  # Kevin's rule: a release must still install cleanly ON TOP OF the version that is
  # already running on a school server. This job installs the newest published release,
  # puts realistic config/state in place, upgrades to the freshly built package and
  # checks that nothing was lost. It skips itself on the very first release.
  #
  # Honest about this package: it ships NO maintainer scripts and NO conffiles, and
  # without `setup` (which needs a domain) it creates no state of its own. So there is
  # no postinst upgrade branch here -- the upgrade path under test is dpkg's own, and
  # the real value of the job is the tripwire: the day someone adds a postinst or
  # declares share.conf a conffile is the day share.conf is silently overwritten.
  upgrade-smoke:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # restrictive org defaults must not break the asset download
    steps:
      # needed for dpkg-parsechangelog and the fixtures
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: packages/
      - name: Fetch the published release to upgrade from
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, never interpolated into the script: a ${{ }} expression in a run
          # block is substituted before the shell sees it, so its content could inject code.
          PREV_TAG: ${{ github.event.inputs.prev_tag }}
        run: |
          set -eu
          mkdir -p previous
          tag="${PREV_TAG:-}"
          if [ -z "$tag" ]; then
            # Prefer the newest real release; fall back to the newest prerelease. Skipping is
            # only legitimate when the repo has NO release at all: this job gates the release
            # job, so a silent skip would publish a tag whose upgrade path was never tested.
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                    --json tagName,isDraft,isPrerelease \
                    --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // ""')
            if [ -z "$tag" ]; then
              tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                      --json tagName,isDraft --jq '[.[] | select(.isDraft == false)][0].tagName // ""')
              [ -n "$tag" ] && echo "::warning::no full release yet, upgrading from prerelease $tag"
            fi
          fi
          if [ -z "$tag" ]; then
            if [ "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq 'length')" != "0" ]; then
              echo "::error::releases exist but none could be selected - refusing to skip"; exit 1
            fi
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::first release of this package, nothing to upgrade from"
            exit 0
          fi
          for i in 1 2 3; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir previous && break
            echo "download attempt $i failed, retrying"; sleep 10
          done
          test -n "$(ls previous/*.deb 2>/dev/null)"
          echo "::notice::upgrading from $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install the released version, upgrade to the built one
        if: steps.prev.outputs.skip != '1'
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./previous/*.deb

          # ---------------------------------------------------------------- state BEFORE
          # The one file this package owns on a configured server: share.conf, written by
          # `setup` (save_config -> configparser, mode 0644). `setup` itself needs a
          # domain, so the file is written by hand here -- same section layout, same keys,
          # same mode, including the recorded group SID that turns a deleted-and-recreated
          # AD group into a plain error message instead of a silent access denial.
          # The package does not ship /etc/linuxmuster-fileserver-verwaltung (debian/install
          # places only usr/ and var/); `setup` creates it with os.makedirs, so the fixture
          # has to create it here too.
          sudo install -d -m 0755 /etc/linuxmuster-fileserver-verwaltung
          sudo tee /etc/linuxmuster-fileserver-verwaltung/share.conf >/dev/null <<'CONF'
          [share]
          name = Verwaltung
          path = /srv/samba/verwaltung
          workgroup = DEV
          rights_group = Domain Admins
          admin_user = DEV\lmnt-admin

          [groups]
          DEV\verwaltung = S-1-5-21-3018922564-942603307-3293085503-1249
          CONF
          sudo chmod 0644 /etc/linuxmuster-fileserver-verwaltung/share.conf

          # Every python below runs with -P: this job checks the repository out, so
          # without it the working directory lands on sys.path and the module under
          # /usr/bin could pull its imports from the SOURCE tree instead of the system.
          # The package's own loader must understand the file -- before and after. A
          # format change that breaks existing installs is the failure this catches;
          # comparing the parse result is stricter than comparing the bytes alone.
          cat > parse-share-conf.py <<'PY'
          import importlib.util
          import json
          import sys
          from importlib.machinery import SourceFileLoader

          loader = SourceFileLoader("lmv", "/usr/bin/linuxmuster-fileserver-verwaltung")
          spec = importlib.util.spec_from_loader("lmv", loader)
          module = importlib.util.module_from_spec(spec)
          loader.exec_module(module)

          parser = module.load_config()
          json.dump(
              {name: dict(parser[name]) for name in parser.sections()},
              sys.stdout,
              sort_keys=True,
              indent=2,
          )
          print()
          PY

          sudo sha256sum /etc/linuxmuster-fileserver-verwaltung/share.conf > before.sha256
          # An empty manifest would pass `sha256sum -c` while proving nothing.
          test -s before.sha256
          sudo stat -c '%a %U:%G %n' /etc/linuxmuster-fileserver-verwaltung/share.conf > before.perms
          python3 -P parse-share-conf.py > before.parsed
          cat before.sha256 before.perms before.parsed

          # ---------------------------------------------------------------- the upgrade
          # --reinstall --allow-downgrades: on main the build is often version-equal to
          # the release, and a plain install would report "already the newest version"
          # and test nothing. With it dpkg really unpacks over the installed version.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --reinstall --allow-downgrades \
            ./packages/linuxmuster-fileserver-verwaltung_*.deb 2>&1 | tee upgrade.log

          # The upgrade path really ran and did not silently no-op: dpkg unpacked OVER
          # the installed version. There is no postinst branch to observe here (the
          # package has none), so the second proof is the payload check further down --
          # the files on disk are the freshly built ones, byte for byte.
          grep -qE 'Unpacking linuxmuster-fileserver-verwaltung \([^)]+\) over \([^)]+\)' upgrade.log
          # dpkg's own record of the action, independent of apt's wording.
          grep -q ' upgrade linuxmuster-fileserver-verwaltung:' /var/log/dpkg.log

          # ---------------------------------------------------------------- state AFTER
          # share.conf byte-identical, mode and ownership unchanged, still parsed the
          # same way by the new version's own loader.
          sudo sha256sum -c before.sha256
          sudo stat -c '%a %U:%G %n' /etc/linuxmuster-fileserver-verwaltung/share.conf > after.perms
          diff -u before.perms after.perms
          python3 -P parse-share-conf.py > after.parsed
          diff -u before.parsed after.parsed

          # The installed version IS the built one, and every shipped file on disk comes
          # from the freshly built .deb -- the CLI and the three .example templates, which
          # are the files that legitimately change between versions.
          version="$(dpkg-parsechangelog -S Version)"
          test "$(dpkg-query -W -f='${Version}' linuxmuster-fileserver-verwaltung)" = "$version"
          deb="$(ls packages/linuxmuster-fileserver-verwaltung_*.deb)"
          for shipped in usr/bin/linuxmuster-fileserver-verwaltung \
                         var/lib/linuxmuster-fileserver-verwaltung/smb.conf.example \
                         var/lib/linuxmuster-fileserver-verwaltung/krb5.conf.example \
                         var/lib/linuxmuster-fileserver-verwaltung/nsswitch.conf.example; do
            from_deb="$(dpkg-deb --fsys-tarfile "$deb" | tar -xOf - "./$shipped" | sha256sum | cut -d' ' -f1)"
            on_disk="$(sha256sum "/$shipped" | cut -d' ' -f1)"
            test "$from_deb" = "$on_disk"
          done

          # The tripwire: no conffiles today. The day someone declares share.conf one,
          # dpkg starts prompting or replacing it on upgrade -- and this fails first.
          test -z "$(dpkg-query -W -f='${Conffiles}' linuxmuster-fileserver-verwaltung)"
          # dpkg --verify is only a real check with md5sums; assert they exist.
          test -s /var/lib/dpkg/info/linuxmuster-fileserver-verwaltung.md5sums
          test -z "$(sudo dpkg --verify linuxmuster-fileserver-verwaltung)"
          test -z "$(dpkg --audit)"
          sudo apt-get -f install -s | grep -q '0 newly installed'

          # The upgraded package still works: CLI on PATH, the pure functions import and
          # run (the same reimport install-smoke does -- "--help" alone passes even when
          # a constant went missing), and the rendered smb.conf is still valid Samba
          # configuration.
          test "$(command -v linuxmuster-fileserver-verwaltung)" = /usr/bin/linuxmuster-fileserver-verwaltung
          linuxmuster-fileserver-verwaltung --help >/dev/null
          linuxmuster-fileserver-verwaltung setup --help >/dev/null
          python3 -P - <<'PY'
          import importlib.util
          from importlib.machinery import SourceFileLoader

          loader = SourceFileLoader("lmv", "/usr/bin/linuxmuster-fileserver-verwaltung")
          spec = importlib.util.spec_from_loader("lmv", loader)
          module = importlib.util.module_from_spec(spec)
          loader.exec_module(module)

          module.validate_share_name("Verwaltung")
          for name in ("Ver/waltung", "a:b", ""):
              try:
                  module.validate_share_name(name)
              except module.SetupError:
                  continue
              raise SystemExit("invalid share name accepted: %r" % name)

          module.check_time_sync()
          print("pure functions OK")
          PY
          sed -e 's/%%DOMAIN%%/LINUXMUSTER.LAN/g' \
              -e 's/%%WORKGROUP%%/LINUXMUSTER/g' \
              -e 's/%%HOSTNAME%%/VERWALTUNG01/g' \
              /var/lib/linuxmuster-fileserver-verwaltung/smb.conf.example \
              | sudo tee /etc/samba/smb.conf > /dev/null
          sudo testparm -s

  release:
    needs: [gate, build, install-smoke, upgrade-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: packages/
      # Draft -> assets -> digest check -> publish (why: see the header), all through the REST
      # API with the gh CLI that ships with the runner. The draft is addressed by the id its
      # create call returns, never by tag: right after a create the release list does not show
      # the draft yet (lmn-gpo v7.3.4, run 35865217323, failed on exactly that), GET
      # releases/tags/{tag} never returns drafts, and `gh release upload/edit <tag>` resolve a
      # draft by its tag as well.
      - name: Publish the GitHub release (draft first)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}     # through env, never interpolated into the script
          # Read-only token for the immutable-releases setting, used for that one call only.
          IMMUTABLE_CHECK_TOKEN: ${{ secrets.IMMUTABLE_CHECK_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Publish the .changes and exactly the files it lists (Files: " md5 size section priority
          # name"), so the .changes never names a file nobody can download.
          changes=(packages/*.changes)
          [ "${#changes[@]}" = 1 ] || { echo "::error::expected one .changes, found ${#changes[@]}"; exit 1; }
          mapfile -t listed < <(awk '/^Files:/ {f = 1; next} f && /^ / {print "packages/" $5; next} f {exit}' "${changes[0]}")
          assets=("${changes[0]}" "${listed[@]}")
          for f in "${assets[@]}"; do
            [ -f "$f" ] || { echo "::error::$f is listed in the .changes but was not built"; exit 1; }
          done
          printf '%s\n' "${listed[@]}" | grep -q '\.deb$' || { echo "::error::the .changes lists no .deb"; exit 1; }
          # GitHub renames special characters in asset names (`~` becomes `.`, `+` stays), so
          # names are compared in this normalised form, in which no two assets may collide.
          norm() { local n=${1##*/}; printf '%s\n' "${n//[^A-Za-z0-9._-]/.}"; }
          dup=$(for f in "${assets[@]}"; do norm "$f"; done | sort | uniq -d)
          [ -z "$dup" ] || { echo "::error::assets collide on GitHub as: $dup"; exit 1; }
          # Only a draft that an EARLIER run left behind is found by listing: it is minutes old,
          # so the list has caught up. A draft this run creates is never looked up. The retry
          # covers transient API errors only; an empty answer is final.
          lookup() {
            local i out
            for i in 1 2 3; do
              if out=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
                         --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft)"'); then
                printf '%s' "$out"; return 0
              fi
              echo "::warning::listing the releases failed (attempt $i of 3)" >&2; sleep $((i * 5))
            done
            return 1
          }
          found=$(lookup) || { echo "::error::cannot list the releases of $GH_REPO"; exit 1; }
          if grep -q ' false$' <<< "$found"; then
            echo "::error::$TAG is already published; its assets are never replaced"; exit 1
          fi
          # Publishing a draft creates a missing tag at the default branch, so the tag must exist
          # (what `gh release create --verify-tag` checked before).
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent \
            || { echo "::error::tag $TAG does not exist in $GH_REPO"; exit 1; }
          case "$(grep -c . <<< "$found" || true)" in
            0) prerelease=false; case "$TAG" in *-rc*) prerelease=true ;; esac
               rid=$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$TAG" -f name="$TAG" \
                       -F draft=true -F prerelease="$prerelease" -F generate_release_notes=true \
                       --jq .id)
               echo "created draft $rid for $TAG" ;;
            1) rid=${found%% *}
               echo "::notice::re-run: completing draft $rid that a failed run left behind" ;;
            *) echo "::error::more than one draft for $TAG: $(tr '\n' ' ' <<< "$found")"; exit 1 ;;
          esac
          [[ "$rid" =~ ^[0-9]+$ ]] || { echo "::error::no release id for $TAG: $rid"; exit 1; }
          # Upload by id, idempotently: an asset of the same name that is already on the draft
          # stays if its sha256 matches and is replaced if not (a rebuild, or an upload a failed
          # run left half done). Assets are deleted only while the release is still a draft.
          on_draft=$(gh api --paginate "repos/$GH_REPO/releases/$rid/assets?per_page=100" \
                       --jq '.[] | "\(.id) \(.digest // "none") \(.name)"')
          for f in "${assets[@]}"; do
            name=$(norm "$f"); sha=$(sha256sum "$f" | cut -d' ' -f1); have=
            while read -r aid digest aname <&3; do
              if [ -z "$aid" ] || [ "$(norm "$aname")" != "$name" ]; then continue; fi
              if [ "$digest" = "sha256:$sha" ]; then have=1; continue; fi
              [ "$(gh api "repos/$GH_REPO/releases/$rid" --jq .draft)" = true ] \
                || { echo "::error::release $rid is no longer a draft, not touching it"; exit 1; }
              echo "replacing $aname on the draft ($digest, built sha256:$sha)"
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$aid"
            done 3<<< "$on_draft"
            if [ -n "$have" ]; then echo "$name is already on the draft, same sha256"; continue; fi
            url="https://uploads.github.com/repos/$GH_REPO/releases/$rid/assets?name=$(jq -rn --arg n "${f##*/}" '$n | @uri')"
            if ! resp=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
                          -H "Accept: application/vnd.github+json" \
                          -H "Content-Type: application/octet-stream" --data-binary "@$f" "$url"); then
              echo "$resp" >&2; echo "::error::upload of $f failed"; exit 1
            fi
            jq -r '"uploaded \(.name): \(.size) bytes, \(.digest)"' <<< "$resp"
          done
          # Publish only what was built: the draft must hold exactly the built files, compared as
          # (sha256 as computed by GitHub, normalised name), nothing more and nothing less.
          for f in "${assets[@]}"; do
            printf '%s %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(norm "$f")"
          done | sort > built.sha256
          gh api --paginate "repos/$GH_REPO/releases/$rid/assets?per_page=100" \
              --jq '.[] | "\(.digest // "none" | ltrimstr("sha256:")) \(.name)"' \
            | while read -r d n; do printf '%s %s\n' "$d" "$(norm "$n")"; done | sort > uploaded.sha256
          diff built.sha256 uploaded.sha256 \
            || { echo "::error::assets on the draft differ from the build, not publishing"; exit 1; }
          # Immutable or not at all (why: see the header). Checked at the last moment the release
          # is still a draft. A repo with the setting off answers {"enabled":false}; the docs also
          # name 404. Anything but enabled == true stops here and leaves the draft unpublished.
          [ -n "${IMMUTABLE_CHECK_TOKEN:-}" ] || {
            echo "::error::secret IMMUTABLE_CHECK_TOKEN is not set, so it cannot be proven that immutable releases are on; draft $rid stays unpublished"; exit 1; }
          if ! enabled=$(GH_TOKEN=$IMMUTABLE_CHECK_TOKEN gh api "repos/$GH_REPO/immutable-releases" --jq '.enabled'); then
            echo "::error::cannot read the immutable-releases setting of $GH_REPO (${enabled//$'\n'/ }); draft $rid stays unpublished"; exit 1
          fi
          [ "$enabled" = true ] || {
            echo "::error::immutable releases are not enabled for $GH_REPO (enabled=$enabled); draft $rid stays unpublished"; exit 1; }
          gh api -X PATCH "repos/$GH_REPO/releases/$rid" -F draft=false --jq '"published \(.html_url)"'
          # Re-read by id: the published release must be immutable. An error, never a warning, or
          # the run ends green with assets that can still be replaced. The retry only covers a
          # read that lags behind the publish.
          immutable=
          for i in 1 2 3; do
            immutable=$(gh api "repos/$GH_REPO/releases/$rid" --jq '.immutable') && [ "$immutable" = true ] && break
            [ "$i" = 3 ] || sleep $((i * 5))
          done
          if [ "$immutable" != true ]; then
            echo "::error::$TAG is published but NOT immutable (immutable=${immutable:-unreadable}), its assets can still be replaced: delete release $rid (the tag stays), turn immutable releases on, re-run this job"
            exit 1
          fi
          echo "$TAG is published and immutable"
