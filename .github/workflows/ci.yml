#
# From linuxmusterDEV/templates/ci.yml. Three jobs on every push/PR: fast tier
# (syntax, lint), package build in the same container upstream CI uses (proves
# it builds on the target Ubuntu/Python), and the install smoke on
# ubuntu-24.04 that release.yml repeats before every release.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # = Ubuntu 24.04 / lmn73
      # >>> fast tier of this repo: one Python CLI without .py extension and no
      # shell scripts, so there is nothing for shellcheck (pinned tool
      # versions, Renovate bumps them) <<<
      - run: pip install ruff==0.15.21
      - name: Python syntax (py_compile)
        run: python3 -m py_compile usr/bin/linuxmuster-fileserver-verwaltung
      - name: ruff (default rule set = pyflakes + pycodestyle errors)
        run: ruff check usr/bin/linuxmuster-fileserver-verwaltung
      # <<<

  resolve:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: |
          DIST=$(dpkg-parsechangelog -S Distribution); NUM="${DIST#lmn}"
          if [ "${NUM:-0}" -ge 74 ] 2>/dev/null; then IMG=ghcr.io/linuxmuster/lmndev-runner:latest; else IMG=ghcr.io/linuxmuster/lmndev-runner:24.04; fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "version=$(dpkg-parsechangelog -S Version)" >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Build package (make deb wraps dpkg-buildpackage)
        run: |
          apt-get update -qq && apt-get build-dep -y -qq . 2>/dev/null || true
          make deb
          mkdir -p output && mv ../*.deb ../*.changes ../*.buildinfo output/
      - name: Lintian (advisory)
        run: lintian output/*.deb || true
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: output/
          if-no-files-found: error

  install-smoke:
    needs: package
    # Building a package that cannot be installed is the failure mode this
    # job exists to catch; the build alone proves nothing about the result.
    runs-on: ubuntu-24.04              # the target OS
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages/
      - name: Install the package
        # All dependencies come from Ubuntu 24.04 itself, no extra apt source.
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./packages/linuxmuster-fileserver-verwaltung_*.deb
      - name: The CLI must be on PATH and runnable
        run: |
          test "$(command -v linuxmuster-fileserver-verwaltung)" = /usr/bin/linuxmuster-fileserver-verwaltung
          linuxmuster-fileserver-verwaltung --help
          linuxmuster-fileserver-verwaltung setup --help
      - name: Pure functions must actually run
        # "--help" exits through argparse and touches almost no code, so it
        # happily passes even when a constant went missing in a refactor and
        # every real invocation dies with a NameError. Import the module and
        # call the functions that need no root and no domain.
        run: |
          python3 - <<'PY'
          import importlib.util
          from importlib.machinery import SourceFileLoader

          loader = SourceFileLoader("lmv", "/usr/bin/linuxmuster-fileserver-verwaltung")
          spec = importlib.util.spec_from_loader("lmv", loader)
          module = importlib.util.module_from_spec(spec)
          loader.exec_module(module)

          module.validate_share_name("Verwaltung")
          for name in ("Ver/waltung", "a:b", ""):
              try:
                  module.validate_share_name(name)
              except module.SetupError:
                  continue
              raise SystemExit("invalid share name accepted: %r" % name)

          module.check_time_sync()
          print("pure functions OK")
          PY
      - name: The templates must be installed
        run: |
          for template in smb.conf krb5.conf nsswitch.conf; do
            test -f "/var/lib/linuxmuster-fileserver-verwaltung/$template.example" \
              || { echo "missing: $template.example"; exit 1; }
          done
      - name: The rendered smb.conf must be valid Samba configuration
        run: |
          sed -e 's/%%DOMAIN%%/LINUXMUSTER.LAN/g' \
              -e 's/%%WORKGROUP%%/LINUXMUSTER/g' \
              -e 's/%%HOSTNAME%%/VERWALTUNG01/g' \
              /var/lib/linuxmuster-fileserver-verwaltung/smb.conf.example \
              | sudo tee /etc/samba/smb.conf > /dev/null
          sudo testparm -s
